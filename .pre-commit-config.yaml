minimum_pre_commit_version: "4.0.0"

default_stages:
  - pre-commit

repos:
  - repo: local
    hooks:
      - id: repository-hygiene
        name: repository hygiene checks
        entry: node ./scripts/pre-commit-checks.js
        language: system

      - id: npm-test
        name: npm test
        entry: npm test
        language: system
        pass_filenames: false
        always_run: true

      - id: trivy-fs
        name: trivy filesystem scan
        entry: node ./scripts/run-trivy.js .
        language: system
        pass_filenames: false
        stages:
          - pre-commit

      - id: ignored-files-cleanliness
        name: ignored files cleanliness
        entry: node ./scripts/clean-ignored.js --check
        language: system
        pass_filenames: false
        stages:
          - pre-push
